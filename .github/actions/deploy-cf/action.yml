name: Deploy to Cloudflare Pages
description: CF Manager 部署到 Cloudflare Pages 的公共逻辑（D1/KV/构建/部署）

# Composite Action —— 由 deploy-cf.yml / deploy-cf-secret.yml 调用
# 调用方负责设置 env: CLOUDFLARE_API_KEY, CLOUDFLARE_EMAIL, ENCRYPTION_KEY, API_SECRET
# CLOUDFLARE_API_KEY 可传入 API Token 或 Global API Key；本 action 会自动检测认证类型。
# 所有部署逻辑集中在此文件，新增表/列迁移只需编辑 schema.sql / migrations.sql

inputs:
  project_name:
    description: 'Pages 项目名称'
    required: false
    default: 'cfmgr'
  d1_database_name:
    description: 'D1 数据库名称'
    required: false
    default: 'cfmgr'
  kv_namespace_name:
    description: 'KV 命名空间名称'
    required: false
    default: 'cfmgr'
  full_wipe:
    description: '完全覆盖：删除并重建 D1 + KV'
    required: false
    default: 'false'
  demo_mode:
    description: '演示模式：保护部署账户（禁止编辑/删除等破坏性操作）'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # checkout 由调用方在工作流中执行（本地 action 需要先 checkout 才能 found action.yml）

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install wrangler
      shell: bash
      run: npm install -g wrangler

    - name: Detect Cloudflare credential type
      shell: bash
      run: |
        CREDENTIAL="$CLOUDFLARE_API_KEY"
        if [ -z "$CREDENTIAL" ]; then
          echo "ERROR: CF_API_KEY 未配置或当前 GitHub Environment 无法读取该 Secret"
          exit 1
        fi

        # API Token 和 Global API Key 没有可靠的本地格式标识，优先调用 Token
        # 验证端点判断；验证失败后再按 Global API Key + Email 验证。
        TOKEN_VERIFY_RESPONSE=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
          -H "Authorization: Bearer $CREDENTIAL" \
          -H "Content-Type: application/json" || true)
        TOKEN_IS_VALID=$(printf '%s' "$TOKEN_VERIFY_RESPONSE" | jq -r \
          '(.success == true) and (.result.status == "active")' 2>/dev/null || printf 'false')

        if [ "$TOKEN_IS_VALID" = "true" ]; then
          echo "Cloudflare credential type: API Token"
          echo "CF_AUTH_TYPE=token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$CREDENTIAL" >> "$GITHUB_ENV"
          # Wrangler 优先识别 API Token，清空 Global Key 以避免选错认证方式。
          echo "CLOUDFLARE_API_KEY=" >> "$GITHUB_ENV"
          exit 0
        fi

        if [ -z "$CLOUDFLARE_EMAIL" ]; then
          echo "ERROR: 提供的 CF_API_KEY 不是有效 API Token；按 Global API Key 使用时必须配置 CF_EMAIL"
          exit 1
        fi

        GLOBAL_KEY_VERIFY_RESPONSE=$(curl -sS "https://api.cloudflare.com/client/v4/user" \
          -H "X-Auth-Email: $CLOUDFLARE_EMAIL" \
          -H "X-Auth-Key: $CREDENTIAL" \
          -H "Content-Type: application/json" || true)
        GLOBAL_KEY_IS_VALID=$(printf '%s' "$GLOBAL_KEY_VERIFY_RESPONSE" | jq -r \
          '.success == true' 2>/dev/null || printf 'false')

        if [ "$GLOBAL_KEY_IS_VALID" != "true" ]; then
          echo "ERROR: CF_API_KEY 既不是有效 API Token，也无法作为 Global API Key 通过认证"
          printf '%s' "$GLOBAL_KEY_VERIFY_RESPONSE" | jq -r '.errors[]?.message' 2>/dev/null || true
          exit 1
        fi

        echo "Cloudflare credential type: Global API Key"
        echo "CF_AUTH_TYPE=global_key" >> "$GITHUB_ENV"
        echo "CLOUDFLARE_API_TOKEN=" >> "$GITHUB_ENV"

    - name: Resolve Cloudflare Account ID
      shell: bash
      run: |
        if [ "$CF_AUTH_TYPE" = "token" ]; then
          ACCOUNTS_RESPONSE=$(curl -sS "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true)
        else
          ACCOUNTS_RESPONSE=$(curl -sS "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "X-Auth-Email: $CLOUDFLARE_EMAIL" \
            -H "X-Auth-Key: $CLOUDFLARE_API_KEY" || true)
        fi

        ACCOUNT_ID=$(printf '%s' "$ACCOUNTS_RESPONSE" | jq -r '.result[0].id // empty' 2>/dev/null || true)
        if [ -z "$ACCOUNT_ID" ]; then
          # 兼容无法列出账户、但 Token 已限定到单一账户的情况。
          ACCOUNT_ID=$(wrangler whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1 || true)
        fi
        if [ -z "$ACCOUNT_ID" ]; then
          echo "WARNING: 无法获取 Account ID（多账户或认证异常），D1/KV 操作可能失败"
        else
          echo "Resolved Account ID: $ACCOUNT_ID"
        fi
        echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

    - name: Setup D1 database
      id: d1
      shell: bash
      run: |
        DB_NAME="${{ inputs.d1_database_name }}"

        ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
        if [ -z "$ACCOUNT_ID" ]; then
          ACCOUNT_ID=$(wrangler whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1 || echo "")
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
        fi
        if [ -z "$ACCOUNT_ID" ]; then
          echo "WARNING: 无法解析 Account ID，D1 操作可能失败"
        fi

        # 用 CF REST API 查询 D1 列表（绕开 wrangler d1 list --json 在 4.x 的兼容性问题）
        cloudflare_api_request() {
          REQUEST_METHOD="$1"
          REQUEST_URL="$2"
          if [ "$CF_AUTH_TYPE" = "token" ]; then
            curl -sS -X "$REQUEST_METHOD" "$REQUEST_URL" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          else
            curl -sS -X "$REQUEST_METHOD" "$REQUEST_URL" \
              -H "X-Auth-Email: $CLOUDFLARE_EMAIL" \
              -H "X-Auth-Key: $CLOUDFLARE_API_KEY"
          fi
        }
        list_d1() {
          cloudflare_api_request GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database"
        }
        DB_LIST=$(list_d1)
        echo "=== CF REST API 查询 D1 数据库结果 ==="
        echo "$DB_LIST" | jq -r '.result[]? | "\(.name)\t\(.uuid)"' 2>/dev/null | head -10 || { echo "API 返回异常，原始输出:"; echo "$DB_LIST"; }

        # 按 name 精确匹配取 uuid
        get_db_id() {
          echo "$1" | jq -r --arg name "$2" '.result[]? | select(.name==$name) | .uuid' 2>/dev/null | head -1
        }

        # --- 完全覆盖：删除旧数据库 ---
        if [ "${{ inputs.full_wipe }}" = "true" ]; then
          echo "完全覆盖模式：尝试删除旧 D1 数据库..."
          DB_OLD_ID=$(get_db_id "$DB_LIST" "$DB_NAME")
          if [ -n "$DB_OLD_ID" ]; then
            echo "找到数据库 ID: $DB_OLD_ID，正在删除..."
            cloudflare_api_request DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database/$DB_OLD_ID" >/dev/null
            sleep 3
            # 确认是否已消失
            DB_LIST2=$(list_d1)
            DB_STILL=$(get_db_id "$DB_LIST2" "$DB_NAME")
            if [ -n "$DB_STILL" ]; then
              echo "API 删除未生效，尝试 wrangler 按名称删除..."
              wrangler d1 delete "$DB_NAME" -y 2>&1 || echo "删除失败，继续"
              sleep 2
            fi
          else
            echo "未在列表中匹配到数据库，尝试 wrangler 按名称删除..."
            wrangler d1 delete "$DB_NAME" -y 2>&1 || echo "数据库可能不存在或已被删除"
            sleep 2
          fi
          # 删除后重新拉取列表
          DB_LIST=$(list_d1)
        fi

        DB_ID=$(get_db_id "$DB_LIST" "$DB_NAME")

        if [ -z "$DB_ID" ]; then
          echo "Creating D1 database: $DB_NAME"
          wrangler d1 create "$DB_NAME"
          DB_LIST2=$(list_d1)
          DB_ID=$(get_db_id "$DB_LIST2" "$DB_NAME")
          echo "Created database with ID: $DB_ID"

          echo "Initializing database schema..."
          wrangler d1 execute "$DB_NAME" --file=worker/src/db/schema.sql --remote
        else
          echo "Database already exists: $DB_NAME (ID: $DB_ID)"
          if [ "${{ inputs.full_wipe }}" = "true" ]; then
            echo "完全覆盖模式：清空所有表数据..."
            wrangler d1 execute "$DB_NAME" --command="DROP TABLE IF EXISTS quota_usage" --remote || true
            wrangler d1 execute "$DB_NAME" --command="DROP TABLE IF EXISTS audit_log" --remote || true
            wrangler d1 execute "$DB_NAME" --command="DROP TABLE IF EXISTS app_settings" --remote || true
            wrangler d1 execute "$DB_NAME" --command="DROP TABLE IF EXISTS accounts" --remote || true
            echo "重新初始化 Schema..."
            wrangler d1 execute "$DB_NAME" --file=worker/src/db/schema.sql --remote
          fi
        fi

        echo "database_id=$DB_ID" >> $GITHUB_OUTPUT

    - name: Run D1 migrations (auto-detect & fix missing tables/columns)
      shell: bash
      run: |
        DB_NAME="${{ inputs.d1_database_name }}"

        echo "=== Step 1: Ensure all tables exist (CREATE TABLE IF NOT EXISTS) ==="
        # schema.sql 全部使用 CREATE TABLE IF NOT EXISTS，对已有表安全无副作用
        # 这会自动补齐旧版部署中缺失的表（如 catalog_sources、app_settings 等）
        wrangler d1 execute "$DB_NAME" --file=worker/src/db/schema.sql --remote

        echo "=== Step 2: Column-level migrations (add missing columns, skip if exists) ==="
        # 迁移语句统一维护在 migrations.sql 中，新增列时只需编辑该文件，无需修改本工作流
        # D1 不支持 IF NOT EXISTS 语法，已存在的列会报错，用 || true 静默跳过
        while IFS= read -r line; do
          line=$(echo "$line" | sed 's/--.*$//' | xargs)
          [ -z "$line" ] && continue
          wrangler d1 execute "$DB_NAME" --command="$line" --remote 2>/dev/null || true
        done < worker/src/db/migrations.sql

        echo "=== Migration complete ==="

    - name: Seed deployment account (full wipe only)
      id: seed
      if: ${{ inputs.full_wipe == 'true' }}
      shell: bash
      run: |
        DB_NAME="${{ inputs.d1_database_name }}"
        if [ "$CF_AUTH_TYPE" = "token" ]; then
          API_CREDENTIAL="$CLOUDFLARE_API_TOKEN"
        else
          API_CREDENTIAL="$CLOUDFLARE_API_KEY"
        fi
        API_EMAIL="$CLOUDFLARE_EMAIL"
        ENC_KEY="$ENCRYPTION_KEY"

        # 获取 Account ID（复用前面解析的 job 环境变量，避免重复 whoami）
        ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
        if [ -z "$ACCOUNT_ID" ]; then
          echo "WARNING: 无法获取 Account ID，account_id 将为空"
        fi

        # 使用 Node.js 加密 API Key（与 worker/src/services/encryption.ts 算法一致）
        ENCRYPTED=$(node -e "
          const crypto = require('node:crypto');
          const text = process.argv[1], rawKey = process.argv[2];
          const keyData = /^[0-9a-fA-F]{64}$/.test(rawKey)
            ? Buffer.from(rawKey, 'hex')
            : crypto.createHash('sha256').update(rawKey).digest();
          crypto.subtle.importKey('raw', keyData, 'AES-GCM', false, ['encrypt']).then(key => {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(text);
            return crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded).then(encrypted => {
              console.log(Buffer.from(iv).toString('hex') + ':' + Buffer.from(encrypted).toString('hex'));
            });
          });
        " "$API_CREDENTIAL" "$ENC_KEY")

        echo "插入部署账户..."
        if [ "$CF_AUTH_TYPE" = "token" ]; then
          wrangler d1 execute "$DB_NAME" --remote --command="INSERT INTO accounts (name, auth_type, api_token, account_id, enabled_features) VALUES ('Deploy Account', 'token', '$ENCRYPTED', '$ACCOUNT_ID', 'ai,workers,browser_render,dns,storage')"
        else
          wrangler d1 execute "$DB_NAME" --remote --command="INSERT INTO accounts (name, auth_type, api_key, email, account_id, enabled_features) VALUES ('Deploy Account', 'global_key', '$ENCRYPTED', '$API_EMAIL', '$ACCOUNT_ID', 'ai,workers,browser_render,dns,storage')"
        fi

        # 获取刚插入的账户 ID（用于演示模式保护）
        DEPLOY_ACCOUNT_ID=$(wrangler d1 execute "$DB_NAME" --remote --command="SELECT id FROM accounts WHERE name='Deploy Account' ORDER BY id DESC LIMIT 1" --json 2>/dev/null | node -e "
          const input = require('fs').readFileSync('/dev/stdin','utf8');
          try {
            const data = JSON.parse(input);
            const row = Array.isArray(data) ? data[0] : data;
            const id = row?.results?.[0]?.id ?? '';
            if (id) console.log(id);
          } catch(e) {}
        " || echo "")
        echo "deploy_account_id=$DEPLOY_ACCOUNT_ID" >> $GITHUB_OUTPUT

    - name: Setup KV namespace
      id: kv
      shell: bash
      run: |
        KV_NAME="${{ inputs.kv_namespace_name }}"

        # Account ID：优先复用前面解析的，否则回退 whoami（legacy 认证）
        ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
        if [ -z "$ACCOUNT_ID" ]; then
          ACCOUNT_ID=$(wrangler whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1 || echo "")
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
        fi
        if [ -z "$ACCOUNT_ID" ]; then
          echo "WARNING: 无法解析 Account ID，KV 操作可能失败"
        fi

        # 用 CF REST API 查询（绕开 wrangler kv namespace list --json 在 4.x 的兼容性问题，
        # 同时保证 account 上下文与后续 wrangler 调用一致）
        cloudflare_api_request() {
          REQUEST_METHOD="$1"
          REQUEST_URL="$2"
          if [ "$CF_AUTH_TYPE" = "token" ]; then
            curl -sS -X "$REQUEST_METHOD" "$REQUEST_URL" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          else
            curl -sS -X "$REQUEST_METHOD" "$REQUEST_URL" \
              -H "X-Auth-Email: $CLOUDFLARE_EMAIL" \
              -H "X-Auth-Key: $CLOUDFLARE_API_KEY"
          fi
        }
        list_kv() {
          cloudflare_api_request GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces"
        }
        KV_LIST_FULL=$(list_kv)

        # --- 完全覆盖：删除同名 namespace ---
        if [ "${{ inputs.full_wipe }}" = "true" ]; then
          echo "完全覆盖模式：清空 KV 命名空间..."
          KV_OLD_ID=$(echo "$KV_LIST_FULL" | jq -r --arg name "$KV_NAME" '.result[]? | select(.title==$name) | .id' 2>/dev/null | head -1 || echo "")
          if [ -n "$KV_OLD_ID" ]; then
            echo "删除旧 KV namespace: $KV_OLD_ID"
            cloudflare_api_request DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces/$KV_OLD_ID" >/dev/null
            echo "等待删除生效..."
            sleep 5
          else
            echo "未找到同名 KV namespace，跳过删除"
          fi
          # 删除后重新拉取列表
          KV_LIST_FULL=$(list_kv)
        fi

        echo "=== CF REST API 查询 KV namespace 结果 ==="
        echo "$KV_LIST_FULL" | jq -r '.result[]? | "\(.title)\t\(.id)"' 2>/dev/null || { echo "API 返回异常，原始输出:"; echo "$KV_LIST_FULL"; }

        KV_ID=$(echo "$KV_LIST_FULL" | jq -r --arg name "$KV_NAME" '.result[]? | select(.title==$name) | .id' 2>/dev/null | head -1 || echo "")

        if [ -z "$KV_ID" ]; then
          echo "未找到已有 namespace，尝试创建..."
          wrangler kv namespace create "$KV_NAME" 2>&1 || true
          # 创建后重新查询（兼容「已存在」冲突：用 API 回退拿到已有 ID，而非直接失败）
          KV_LIST_FULL=$(list_kv)
          KV_ID=$(echo "$KV_LIST_FULL" | jq -r --arg name "$KV_NAME" '.result[]? | select(.title==$name) | .id' 2>/dev/null | head -1 || echo "")
        fi

        if [ -z "$KV_ID" ]; then
          echo "ERROR: 无法获取 KV namespace ID"
          echo "请手动在 CF Dashboard 中查询 $KV_NAME 的 namespace ID 并填入 wrangler.toml"
          exit 1
        fi

        echo "KV namespace ready: $KV_NAME (ID: $KV_ID)"
        echo "kv_namespace_id=$KV_ID" >> $GITHUB_OUTPUT

    - name: Update wrangler.toml
      working-directory: worker
      shell: bash
      run: |
        sed -i '/^main = /d' wrangler.toml
        sed -i '/^\[vars\]/,/^$/d' wrangler.toml
        sed -i "s/database_id = \".*\"/database_id = \"${{ steps.d1.outputs.database_id }}\"/" wrangler.toml
        sed -i "s/id = \"YOUR_KV_NAMESPACE_ID\"/id = \"${{ steps.kv.outputs.kv_namespace_id }}\"/" wrangler.toml
        sed -i "s/^name = \".*\"/name = \"${{ inputs.project_name }}\"/" wrangler.toml

    - name: Install worker dependencies
      working-directory: worker
      shell: bash
      run: npm install

    - name: Build
      working-directory: worker
      shell: bash
      run: node build.js

    - name: Create Pages project if not exists
      shell: bash
      run: |
        PROJECT="${{ inputs.project_name }}"
        if wrangler pages project list 2>/dev/null | grep -qF "$PROJECT"; then
          echo "Project '$PROJECT' already exists, skipping creation"
        else
          wrangler pages project create "$PROJECT" --production-branch main
        fi

    - name: Configure secrets
      id: secrets
      shell: bash
      run: |
        PROJECT="${{ inputs.project_name }}"
        DB_NAME="${{ inputs.d1_database_name }}"

        # 使用 here-string 传入，并用 $VAR 引用 job 环境变量，避免明文出现在回显的脚本里
        wrangler pages secret put ENCRYPTION_KEY --project-name "$PROJECT" <<< "$ENCRYPTION_KEY"
        if [ -n "$API_SECRET" ]; then
          wrangler pages secret put API_SECRET --project-name "$PROJECT" <<< "$API_SECRET"
        fi

        # 演示模式：保护部署账户（仅 demo_mode=true 时启用）。full_wipe 时直接使用
        # seed 步骤输出；已有数据库则按凭据类型及 Cloudflare Account ID 查找。
        if [ "${{ inputs.demo_mode }}" = "true" ]; then
          DEMO_IDS="${{ steps.seed.outputs.deploy_account_id }}"
          if [ -z "$DEMO_IDS" ] && [ "$CF_AUTH_TYPE" = "token" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ESC_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sed "s/'/''/g")
            DEMO_IDS=$(wrangler d1 execute "$DB_NAME" --remote --command="SELECT GROUP_CONCAT(id) AS ids FROM accounts WHERE auth_type='token' AND account_id='$ESC_ACCOUNT_ID'" --json 2>/dev/null | node -e "
              const input = require('fs').readFileSync('/dev/stdin','utf8');
              try {
                const data = JSON.parse(input);
                const row = Array.isArray(data) ? data[0] : data;
                const ids = row?.results?.[0]?.ids ?? '';
                if (ids) console.log(ids);
              } catch(e) {}
            " || echo "")
          fi

          DEPLOY_EMAIL="$CLOUDFLARE_EMAIL"
          if [ -z "$DEMO_IDS" ] && [ -n "$DEPLOY_EMAIL" ]; then
            echo "演示模式已启用，根据部署邮箱查询账户 ID: $DEPLOY_EMAIL"
            # 转义单引号，避免 email 含引号导致 SQL 语法错误
            ESC_EMAIL=$(printf '%s' "$DEPLOY_EMAIL" | sed "s/'/''/g")
            DEMO_IDS=$(wrangler d1 execute "$DB_NAME" --remote --command="SELECT GROUP_CONCAT(id) AS ids FROM accounts WHERE email='$ESC_EMAIL'" --json 2>/dev/null | node -e "
              const input = require('fs').readFileSync('/dev/stdin','utf8');
              try {
                const data = JSON.parse(input);
                const row = Array.isArray(data) ? data[0] : data;
                const ids = row?.results?.[0]?.ids ?? '';
                if (ids) console.log(ids);
              } catch(e) {}
            " || echo "")
          fi

          if [ -n "$DEMO_IDS" ]; then
            echo "保护部署账户 IDs: $DEMO_IDS"
            echo "$DEMO_IDS" | wrangler pages secret put DEMO_ACCOUNT_IDS --project-name "$PROJECT"
          else
            echo "未在 D1 中找到匹配部署凭据的账户，跳过 DEMO_ACCOUNT_IDS 设置"
          fi
          echo "demo_ids=${DEMO_IDS:-\"(无匹配账户)\"}" >> "$GITHUB_OUTPUT"
        else
          echo "演示模式已关闭，所有账户均可自由编辑/删除"
          echo "" | wrangler pages secret put DEMO_ACCOUNT_IDS --project-name "$PROJECT" 2>/dev/null || true
          echo "demo_ids=(关闭)" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to Cloudflare Pages
      id: deploy
      working-directory: worker
      shell: bash
      run: |
        # 不显式传目录：wrangler.toml 已配置 pages_build_output_dir = "public"
        wrangler pages deploy --project-name "${{ inputs.project_name }}" --branch main --commit-dirty

        # 获取 Account ID（优先复用前面解析的，否则回退 whoami）
        ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-$(wrangler whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1 || echo "")}"

        # 通过 CF API 查询项目的实际 subdomain
        if [ -n "$ACCOUNT_ID" ]; then
          if [ "$CF_AUTH_TYPE" = "token" ]; then
            PROJECT_DETAILS=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/${{ inputs.project_name }}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          else
            PROJECT_DETAILS=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/${{ inputs.project_name }}" \
              -H "X-Auth-Email: $CLOUDFLARE_EMAIL" \
              -H "X-Auth-Key: $CLOUDFLARE_API_KEY")
          fi
          echo "Project API response: $PROJECT_DETAILS"
          RAW_SUBDOMAIN=$(echo "$PROJECT_DETAILS" | jq -r '.result.subdomain // empty' | tr -d '\r\n')
          echo "RAW_SUBDOMAIN=[$RAW_SUBDOMAIN]"
          # 统一处理：API 返回的 subdomain 可能是前缀(mgrcf)或完整域名(mgrcf.pages.dev)，
          # 用纯 bash 字符串处理剥掉末尾的 .pages.dev（不依赖 sed/正则引擎）。
          case "$RAW_SUBDOMAIN" in
            *.pages.dev)  PROJECT_SUBDOMAIN="${RAW_SUBDOMAIN%.pages.dev}" ;;
            *.pages.dev/) PROJECT_SUBDOMAIN="${RAW_SUBDOMAIN%.pages.dev/}" ;;
            *)            PROJECT_SUBDOMAIN="$RAW_SUBDOMAIN" ;;
          esac
        fi

        # 兜底：拿不到则使用「项目名」
        if [ -z "$PROJECT_SUBDOMAIN" ]; then
          echo "WARNING: 无法获取项目 subdomain，fallback 使用项目名"
          PROJECT_SUBDOMAIN="${{ inputs.project_name }}"
        fi
        PROJECT_SUBDOMAIN="${PROJECT_SUBDOMAIN}.pages.dev"

        echo "实际部署域名: ${PROJECT_SUBDOMAIN}"
        echo "deploy_url=https://${PROJECT_SUBDOMAIN}/admin/" >> $GITHUB_OUTPUT

    - name: Deployment summary
      shell: bash
      run: |
        echo "## 部署完成 ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 配置项 | 值 |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
        echo "| CF 邮箱 | (出于安全不显示) |" >> $GITHUB_STEP_SUMMARY
        echo "| CF API Key | **** (已隐藏) |" >> $GITHUB_STEP_SUMMARY
        echo "| Pages 项目 | ${{ inputs.project_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| D1 数据库 | ${{ inputs.d1_database_name }} (${{ steps.d1.outputs.database_id }}) |" >> $GITHUB_STEP_SUMMARY
        echo "| KV 命名空间 | ${{ inputs.kv_namespace_name }} (${{ steps.kv.outputs.kv_namespace_id }}) |" >> $GITHUB_STEP_SUMMARY
        echo "| 完全覆盖 | ${{ inputs.full_wipe }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 演示模式 | ${{ inputs.demo_mode }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 演示保护账户 IDs | ${{ steps.secrets.outputs.demo_ids }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 访问地址 | ${{ steps.deploy.outputs.deploy_url }} |" >> $GITHUB_STEP_SUMMARY
